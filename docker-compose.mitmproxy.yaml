#ddev-generated
services:
  mitmproxy:
    image: ${MITMPROXY_DOCKER_IMAGE:-mitmproxy/mitmproxy:latest}
    container_name: ddev-${DDEV_SITENAME}-mitmproxy
    restart: "no"
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=8081:8081
      - HTTPS_EXPOSE=8082:8081
    # These labels ensure this service is discoverable by DDEV.
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    command: mitmweb -vv --web-host 0.0.0.0 --set web_password='${MITMPROXY_PASSWORD:-mitm}'
    volumes:
      - ".:/mnt/ddev_config"
      - "ddev-global-cache:/mnt/ddev-global-cache"
      - mitmproxy:/home/mitmproxy/.mitmproxy
    x-ddev:
      # Can be multi-line block
      describe-info: |
        Pass: ${MITMPROXY_PASSWORD}

volumes:
  mitmproxy:
    name: "${DDEV_SITENAME}_mitmproxy"
